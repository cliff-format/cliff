name: ci

on:
  push:
  pull_request:

jobs:
  cliff:
    runs-on: ubuntu-latest
    steps:
      # Both repositories are checked out **as siblings**, under names that match the
      # layout the checker assumes: it resolves the reference implementation at
      # `<workspace>/cliff-python/src` relative to this repository's root. Checking
      # this repository out at the workspace root instead puts the sibling one level
      # too high, and the checker then exits 2 with "cliff_format is not importable" -
      # which is what the first version of this workflow did.
      - name: Check out the specification
        uses: actions/checkout@v4
        with:
          path: cliff

      # `tools/check_examples.py` validates every example by parsing it with the
      # reference implementation, so it cannot run without one.
      - name: Check out the reference implementation
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/cliff-python
          path: cliff-python

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The repository's only executable check: it validates the example documents and
      # the fenced documents in the prose. It uses the standard library plus the
      # sibling implementation, so there is no install step - a dependency here would
      # be a dependency in every consumer's build.
      - name: Examples and document-style fences
        run: python cliff/tools/check_examples.py
